name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (dev / stg / prod)'
        type: string
        default: dev
      github_owner:
        description: 'GitHub owner (OIDC trust condition)'
        type: string
        default: ta2tree101343-afk
      github_repo:
        description: 'GitHub repo (OIDC trust condition)'
        type: string
        default: Medical-Access-LOD
      snapshot_date:
        description: 'Scheduler snapshot date (YYYY-MM-DD)'
        type: string
        required: true
      source_url:
        description: 'Scheduler source ZIP URL (HTTPS; must contain YYYYMMDD)'
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    name: Build image + CDK deploy + publish lod/
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # aws-actions/configure-aws-credentials v4.0.2
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-medical-access-lod-${{ inputs.env }}
          aws-region: ${{ env.AWS_REGION }}

      # aws-actions/amazon-ecr-login v2.0.1
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      # arm64 クロスビルド用の QEMU emulation を有効化する (runner は amd64)。
      # これがないと `docker build --platform linux/arm64` の RUN 段で
      # `exec /bin/sh: exec format error` が出る。
      # docker/setup-qemu-action v3.2.0
      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf
        with:
          platforms: arm64

      # buildx builder を有効化 (multi-platform build に必須)
      # docker/setup-buildx-action v3.7.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349

      - name: Build and push Docker image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV_NAME: ${{ inputs.env }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # commit SHA を Lambda 参照用の一意タグに使う。従来は関数ごとの固定タグ
          # (download / normalize / ...) を毎ビルドで上書きしていたため、
          # CloudFormation が ECR image の変更を差分として検知できず Lambda が
          # 古い image のまま放置される問題があった。SHA タグは commit 単位で
          # 一意 & 不変になるので、CDK の tagOrDigest に渡すだけで確実に
          # Lambda が更新される。
          # `latest` は人間向けのタグとして併記して push する (Lambda は参照しない)。
          REPO="$REGISTRY/medical-access-lod-$ENV_NAME-pipeline"
          # buildx で 1 発 build & push。--platform 指定と --push を組み合わせるとき
          # 通常の `docker build` + `docker push` の 2 段だと buildx builder が
          # daemon に image を load しないため push が失敗する。buildx build --push
          # が multi-platform / cross-arch build 時の推奨。
          docker buildx build \
            --platform linux/arm64 \
            -t "$REPO:$COMMIT_SHA" \
            -t "$REPO:latest" \
            --push \
            .
          echo "image_tag=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # actions/setup-node v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK deps
        working-directory: infra
        run: npm ci

      - name: CDK deploy
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          ENV_NAME: ${{ inputs.env }}
          GH_OWNER: ${{ inputs.github_owner }}
          GH_REPO: ${{ inputs.github_repo }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          SOURCE_URL: ${{ inputs.source_url }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          npx cdk deploy --all --require-approval never \
            -c env="$ENV_NAME" \
            -c githubOwner="$GH_OWNER" \
            -c githubRepo="$GH_REPO" \
            -c snapshotDate="$SNAPSHOT_DATE" \
            -c sourceUrl="$SOURCE_URL" \
            -c imageTag="$IMAGE_TAG"

      - name: Sync lod/ to dist bucket
        env:
          ENV_NAME: ${{ inputs.env }}
        run: |
          aws s3 sync lod/ "s3://medical-access-lod-$ENV_NAME-dist/latest/" \
            --cache-control "public, max-age=3600" \
            --exclude "manifest.json" \
            --exclude "*.md"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/latest/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not set; skipping invalidation."
          fi

      - name: Smoke test — API and dist bucket
        env:
          ENV_NAME: ${{ inputs.env }}
        run: |
          set -euo pipefail

          # CFN Outputs から公開 URL を取得する。stack の Output キー名は
          # infra/lib/{api,delivery}-stack.ts で定義済み。
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "MedicalAccessLod-$ENV_NAME-Api" \
            --query 'Stacks[0].Outputs[?OutputKey==`HttpApiUrl`].OutputValue' \
            --output text)
          DIST_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "MedicalAccessLod-$ENV_NAME-Delivery" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomain`].OutputValue' \
            --output text)
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "MedicalAccessLod-$ENV_NAME-Delivery" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)

          echo "API_URL=$API_URL"
          echo "DIST_DOMAIN=$DIST_DOMAIN"
          echo "DIST_ID=$DIST_ID"

          # 1. /health は Read Model 未投入でも 200 を返す
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 --retry-connrefused \
            "$API_URL/health"

          # 2. /metadata が 200 で PDL 1.0 を含む
          curl --fail --show-error --silent \
            "$API_URL/metadata" | grep -q "PDL 1.0"

          # 3. CloudFront は初回デプロイで 15〜20 分伝播にかかる。curl だけの
          #    リトライ (最大数分) では時間切れになるので、CFN 側で
          #    Distribution が全 edge に配信済みになるまで明示的に待つ。
          #    2 回目以降のデプロイでは即座に返る。
          echo "Waiting for CloudFront distribution to be deployed (may take up to 20 minutes on first run)..."
          aws cloudfront wait distribution-deployed --id "$DIST_ID"

          curl --fail --show-error --silent --head \
            --retry 5 --retry-delay 15 --retry-connrefused \
            "https://$DIST_DOMAIN/latest/medical-access-lod.ttl"

          echo "smoke tests passed"
